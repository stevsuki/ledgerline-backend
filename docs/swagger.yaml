        example: true
        type: boolean
      name:
        example: Admin
        type: string
      permissions:
        items:
          $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.RoleMenuPermissionResponseDTO'
        type: array
      updated_at:
        example: "2026-01-02T15:04:05Z"
        type: string
      updated_by:
        example: 6f1e2b7e-2c8a-4c1f-9f3e-6a0f1c2d3e4b
        type: string
