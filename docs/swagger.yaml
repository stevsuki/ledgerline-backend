        type: string
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.UpdateWalletRequestDTO:
    properties:
      balance:
        example: 41200000
        type: integer
      credit_limit:
        example: 25000000
        minimum: 0
        type: integer
      currency:
        enum:
        - IDR
        - USD
        - SGD
        example: IDR
        type: string
      due_day:
        example: 18
        maximum: 31
        minimum: 1
        type: integer
      icon:
        example: bank
        maxLength: 50
        type: string
      include_in_total:
        example: true
        type: boolean
      name:
        example: BCA Utama
        maxLength: 100
        minLength: 2
        type: string
      reference:
        example: "1234567890"
        maxLength: 50
        type: string
      type:
        enum:
        - bank
        - ewallet
        - card
        - cash
        example: bank
        type: string
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.UserResponseDTO:
