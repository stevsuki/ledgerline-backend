  github_com_stevensuki_ledgerline-backend_pkg_response.Success:
    properties:
      data: {}
      message:
        example: success
        type: string
      meta:
        $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_pkg_response.Meta'
      success:
        example: true
        type: boolean
