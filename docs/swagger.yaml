        example: "2026-08-26T15:04:05Z"
        type: string
      created_at:
        example: "2026-01-02T15:04:05Z"
        type: string
      created_by:
        example: 6f1e2b7e-2c8a-4c1f-9f3e-6a0f1c2d3e4b
        type: string
      credit_limit:
        description: null on every type but card.
        example: 25000000
        type: integer
      currency:
        example: IDR
        type: string
      due_day:
        example: 18
        type: integer
      icon:
        example: bank
        type: string
      id:
        example: 6f1e2b7e-2c8a-4c1f-9f3e-6a0f1c2d3e4b
        type: string
      include_in_total:
        example: true
        type: boolean
      name:
        example: BCA Payroll
        type: string
      reference:
        example: "1234567890"
        type: string
      type:
        example: bank
        type: string
      updated_at:
        example: "2026-01-02T15:04:05Z"
        type: string
      updated_by:
        example: 6f1e2b7e-2c8a-4c1f-9f3e-6a0f1c2d3e4b
        type: string
    type: object
  github_com_stevensuki_ledgerline-backend_pkg_response.Error:
