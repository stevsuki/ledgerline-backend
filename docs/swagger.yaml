    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.RoleMenuPermissionResponseDTO:
    properties:
      can_approve:
        example: true
        type: boolean
      can_create:
        example: true
        type: boolean
      can_delete:
        example: true
        type: boolean
      can_read:
        example: true
        type: boolean
      can_update:
        example: true
        type: boolean
      menu_id:
        example: b0000000-0000-0000-0000-000000000002
        type: string
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.RoleResponseDTO:
    properties:
      created_at:
        example: "2026-01-02T15:04:05Z"
        type: string
      created_by:
        description: |-
          null on the built-in roles, which the migration seeds. deleted_by is left
          out: a deleted role is never in a response.
        example: 6f1e2b7e-2c8a-4c1f-9f3e-6a0f1c2d3e4b
        type: string
      description:
        example: Built-in role with access to every menu
        type: string
      id:
        example: 00000000-0000-0000-0000-000000000001
        type: string
      is_system:
        description: Built-in roles must not be renamed or deleted; the UI hides those
