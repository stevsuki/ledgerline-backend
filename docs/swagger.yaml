host: localhost:8080
info:
  contact:
    email: dev@example.com
    name: Tim LedgerLine
  description: LedgerLine backend API.
  license:
    name: MIT
  termsOfService: https://example.com/terms
  title: LedgerLine API
  version: "1.0"
paths:
  /audit-logs:
    get:
      description: Activity feed. Newest first unless sort says otherwise.
      parameters:
      - description: Search by actor, action, detail or module
        in: query
        name: search
        type: string
      - default: -created_at
        description: 'Order: user_full_name, role_name, action, detail_text, status,
          severity, module, user_id, ip_address, created_at. Prefix - for desc'
        in: query
        name: sort
        type: string
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_pkg_response.Success'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.AuditLogResponseDTO'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - audit-logs
  /audit-logs/export:
    get:
      description: Same filters as the list, so the file matches the table it was
        exported from. from/to are dates (YYYY-MM-DD); to covers the whole day. Rows
        are streamed, newest first.
      parameters:
      - description: Start date, inclusive
        example: "2026-08-01"
        in: query
        name: from
        type: string
      - description: End date, inclusive
        example: "2026-08-31"
        in: query
        name: to
        type: string
      - description: Search by actor, action, detail or module
        in: query
        name: search
        type: string
      - description: Filter by actor id
        in: query
        name: user_id
        type: string
      - description: Filter by outcome
        enum:
        - success
        - failed
        in: query
        name: status
        type: string
      - description: Filter by severity
        enum:
        - info
        - warning
        - critical
        in: query
        name: severity
        type: string
      - description: Filter by module
        in: query
        name: module
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: CSV file
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Export audit logs as CSV
      tags:
      - audit-logs
  /audit-logs/options:
    get:
      description: Values for the actor, module, status and severity dropdowns. Actors
        reflect who has actually been recorded; the rest are fixed vocabularies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_pkg_response.Success'
            - properties:
                data:
