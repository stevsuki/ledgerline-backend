      errors:
        items:
          $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_pkg_response.FieldError'
        type: array
      message:
        example: something went wrong
        type: string
      request_id:
        example: 9b2c1f2e-6f0a-4a1e-9c7d-2f8b0a1c3d4e
        type: string
      success:
        example: false
        type: boolean
    type: object
  github_com_stevensuki_ledgerline-backend_pkg_response.FieldError:
    properties:
      field:
        example: email
