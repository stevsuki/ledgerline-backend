basePath: /api/v1
definitions:
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.ActorOptionDTO:
    properties:
      label:
        example: Rangga Aditama
        type: string
      role:
        example: Owner
        type: string
      value:
        example: 01a05b87-ac4c-7332-a78c-c60bcec135de
        type: string
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.AuditLogOptionsResponseDTO:
    properties:
      actors:
        items:
          $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.ActorOptionDTO'
        type: array
      modules:
        items:
          $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.FilterOptionDTO'
        type: array
      severities:
        items:
          $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.FilterOptionDTO'
        type: array
      statuses:
        items:
          $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.FilterOptionDTO'
        type: array
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.AuditLogOverviewResponseDTO:
    properties:
      events:
        example: 28
        type: integer
      failed_sign_in_addresses:
        example: 1
        type: integer
      failed_sign_ins:
        example: 1
        type: integer
      modules:
        example: 9
        type: integer
      retention_days:
        description: RetentionDays is policy; no job deletes old rows yet.
        example: 365
        type: integer
      sensitive:
        description: Sensitive counts everything above info severity.
        example: 8
        type: integer
      window_days:
        description: WindowDays is the period every count below covers.
        example: 7
        type: integer
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.AuditLogResponseDTO:
    properties:
      action:
        example: auth.login
        type: string
      created_at:
        example: "2026-08-27 19:41:00"
        type: string
      detail_text:
        example: Email + password · Chrome on macOS
        type: string
      details:
        description: Details is one of the kind-tagged shapes in domain; see AuditKind.
      id:
        example: 01a05b87-ac4c-7332-a78c-c60bcec135de
        type: string
      ip_address:
        description: IPAddress is empty for entries written outside an HTTP request.
        example: 103.28.14.7
        type: string
      module:
        example: auth
        type: string
      role_name:
        example: Owner
        type: string
      severity:
        enum:
        - info
        - warning
        - critical
        example: info
        type: string
      status:
        enum:
        - success
        - failed
        example: success
        type: string
      user_full_name:
        example: Rangga Aditama
        type: string
      user_id:
        example: 01a05b87-ac4c-7332-a78c-c60bcec135de
        type: string
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.CategoryResponseDTO:
    properties:
      created_at:
        example: "2026-01-02T15:04:05Z"
        type: string
      created_by:
        description: 'deleted_by is left out: a deleted category is never in a response.'
        example: 6f1e2b7e-2c8a-4c1f-9f3e-6a0f1c2d3e4b
        type: string
      id:
        example: 6f1e2b7e-2c8a-4c1f-9f3e-6a0f1c2d3e4b
        type: string
      name:
        example: Gaji
        type: string
      type:
        example: income
        type: string
      updated_at:
        example: "2026-01-02T15:04:05Z"
        type: string
      updated_by:
        example: 6f1e2b7e-2c8a-4c1f-9f3e-6a0f1c2d3e4b
        type: string
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.CreateCategoryRequestDTO:
    properties:
      name:
        example: Gaji
        maxLength: 100
        minLength: 2
        type: string
      type:
        enum:
        - income
        - expense
        example: income
        type: string
    required:
    - name
    - type
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.CreateRoleMenuPermissionRequestDTO:
    properties:
      can_approve:
        example: true
        type: boolean
      can_create:
        example: true
        type: boolean
      can_delete:
        example: true
        type: boolean
      can_read:
        example: true
        type: boolean
      can_update:
        example: true
        type: boolean
      menu_id:
        example: b0000000-0000-0000-0000-000000000002
        type: string
    required:
    - menu_id
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.CreateRoleRequestDTO:
    properties:
      description:
        example: Handles day to day transactions
        maxLength: 255
        type: string
      name:
        example: Finance Staff
        maxLength: 50
        minLength: 2
        type: string
      permissions:
        items:
          $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.CreateRoleMenuPermissionRequestDTO'
        type: array
    required:
    - name
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.CreateUserRequestDTO:
    properties:
      email:
        example: budi@example.com
        type: string
      full_name:
        example: Budi Santoso
        maxLength: 100
        minLength: 3
        type: string
      password:
        example: Rahasia123!
        maxLength: 72
        minLength: 8
        type: string
      role_id:
        description: Omitted means the built-in User role; an unknown id is rejected
          as 400.
        example: 00000000-0000-0000-0000-000000000002
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.CreateWalletRequestDTO:
    properties:
      balance:
        description: 'No "required" on these two: it would reject a 0 balance and
          include_in_total=false.'
        example: 41200000
        type: integer
      credit_limit:
        description: Card wallets only; sending either on another type is rejected.
        example: 25000000
        minimum: 0
        type: integer
      currency:
        enum:
        - IDR
        - USD
        - SGD
        example: IDR
        type: string
      due_day:
        example: 18
        maximum: 31
        minimum: 1
        type: integer
      icon:
        example: bank
        maxLength: 50
        type: string
      include_in_total:
        example: true
        type: boolean
      name:
        example: BCA Payroll
        maxLength: 100
        minLength: 2
        type: string
      reference:
        description: reference and icon are nullable in the table, so they stay optional
          here.
        example: "1234567890"
        maxLength: 50
        type: string
      type:
        enum:
        - bank
        - ewallet
        - card
        - cash
        example: bank
        type: string
    required:
    - currency
    - name
    - type
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.CurrencyAmountResponseDTO:
    properties:
      amount:
        example: 1480
        type: integer
      currency:
        example: USD
        type: string
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.FilterOptionDTO:
    properties:
      label:
        example: Auth
        type: string
      value:
        example: auth
        type: string
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.ForgotPasswordRequestDTO:
    properties:
      email:
        example: budi@example.com
        type: string
    required:
    - email
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.LoginRequestDTO:
    properties:
      email:
        example: budi@example.com
        type: string
      password:
        example: Rahasia123!
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.MenuAccessResponseDTO:
    properties:
      can_approve:
        example: false
        type: boolean
      can_create:
        example: true
        type: boolean
      can_delete:
        example: true
        type: boolean
      can_read:
        example: true
        type: boolean
      can_update:
        example: true
        type: boolean
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.MenuResponseDTO:
    properties:
      access:
        $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.MenuAccessResponseDTO'
      children:
        items:
          $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.MenuResponseDTO'
        type: array
      code:
        example: transactions
        type: string
      icon:
        example: swap
        type: string
      id:
        type: string
      name:
        example: Transactions
        type: string
      path:
        type: string
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.ProfileResponseDTO:
    properties:
      menus:
        items:
          $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.MenuResponseDTO'
        type: array
      user:
        $ref: '#/definitions/github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.UserResponseDTO'
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.RefreshTokenRequestDTO:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    required:
    - refresh_token
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.RegisterRequestDTO:
    properties:
      email:
        example: budi@example.com
        type: string
      full_name:
        example: Budi Santoso
        maxLength: 100
        minLength: 3
        type: string
      password:
        example: Rahasia123!
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  github_com_stevensuki_ledgerline-backend_internal_delivery_http_dto.ResetPasswordRequestDTO:
    properties:
      confirm_new_password:
        example: RahasiaBaru123!
        type: string
      new_password:
        example: RahasiaBaru123!
